services:
  postgres:
    image: postgres:16
    container_name: film-postgres
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - film-network

  backend:
    build:
      context: ./backend

    container_name: film-backend
    restart: always

    depends_on:
      - postgres

    environment:
      PORT: ${BACKEND_PORT}

      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}

      DATABASE_HOST: postgres
      DATABASE_PORT: ${POSTGRES_PORT}
      DATABASE_NAME: ${POSTGRES_DB}

      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - film-network

  frontend:
    build:
      context: ./frontend

    container_name: film-frontend
    restart: always

    volumes:
      - frontend_dist:/usr/share/nginx/html

    networks:
      - film-network

  nginx:
    build:
      context: ./nginx

    container_name: film-nginx
    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend
      - frontend

    volumes:
      - frontend_dist:/usr/share/nginx/html

    networks:
      - film-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: film-pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "8080:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

    networks:
      - film-network

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  film-network:
    driver: bridge
